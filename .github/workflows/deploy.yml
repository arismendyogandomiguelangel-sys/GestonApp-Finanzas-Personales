# CI validation for the Vercel deployment.
#
# Vercel owns production deployments for this project. GitHub Actions only
# validates the Next.js application and must not provision or contact AWS.
name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm --workspace @expense-budget-tracker/agent-shared run build

      - name: Type-check web app
        run: npm --workspace apps/web run lint

      - name: Build web app
        run: npm --workspace apps/web run build
