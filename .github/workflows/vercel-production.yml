name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0

      - id: configuration
        name: Check Vercel deployment configuration
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deployment skipped until VERCEL_TOKEN is configured as a repository secret."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel production configuration
        if: steps.configuration.outputs.configured == 'true'
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: steps.configuration.outputs.configured == 'true'
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: steps.configuration.outputs.configured == 'true'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
